services:
  - type: web
    name: nithya-portfolio
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: NODE_VERSION
        value: "22.16.0"
      - key: VITE_API_BASE_URL
        value: "/api/v1"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: "portfolio"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false